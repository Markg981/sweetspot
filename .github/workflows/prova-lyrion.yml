# SPDX-License-Identifier: GPL-3.0-or-later
# Prova di Lyrion sui pacchetti gia' compilati, senza ricompilare: utile per
# correggere tests/prova-lyrion.sh o capire un errore in pochi minuti. Usa i
# pacchetti di aggiornamento dell'ultima esecuzione di "Compila Sweetspot"
# su main che li ha prodotti, oppure di quella indicata a mano. Si avvia a
# mano (Actions > Prova di Lyrion > Run workflow): nelle PR la prova vera e'
# il job "lyrion" di Compila Sweetspot, sui pacchetti della PR stessa.
name: Prova di Lyrion

on:
  workflow_dispatch:
    inputs:
      esecuzione:
        description: "Numero dell'esecuzione di Compila Sweetspot con i pacchetti (vuoto: l'ultima su main)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  lyrion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheda: x86_64
            runner: ubuntu-26.04
          - scheda: rpi
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Esecuzione con i pacchetti
        id: esecuzione
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDA: ${{ matrix.scheda }}
          SCELTA: ${{ inputs.esecuzione }}
        run: |
          # Nome del pacchetto: come file (dalla CI aggiornata) o, nelle
          # esecuzioni precedenti, dentro uno zip con il nome senza .tar.
          nome=""
          trova() { # esecuzione
            for n in "sweetspot-$SCHEDA-aggiornamento.tar" "sweetspot-$SCHEDA-aggiornamento"; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" --jq '.artifacts[] | select(.expired | not) | .name' |
                grep -qx "$n"; then
                nome=$n
                return 0
              fi
            done
            return 1
          }
          id=$SCELTA
          if [ -n "$id" ]; then
            trova "$id" || id=""
          else
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
              if trova "$r"; then
                id=$r
                break
              fi
            done
          fi
          [ -n "$id" ] || { echo "::error::nessuna esecuzione con il pacchetto sweetspot-$SCHEDA-aggiornamento"; exit 1; }
          echo "Pacchetto $nome dell'esecuzione $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.esecuzione.outputs.nome }}
          run-id: ${{ steps.esecuzione.outputs.id }}
          github-token: ${{ github.token }}
      - name: Strumenti
        run: sudo apt-get update && sudo apt-get install -y zstd cpio curl
      # Con la scheda virtuale la prova copre anche il percorso ALSA.
      - name: Scheda audio virtuale snd-aloop
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe snd-aloop id=Loopback pcm_substreams=1 || echo "snd-aloop non disponibile: solo prova software"
      - name: Avvio di Lyrion nel sistema compilato
        run: sudo -E sh tests/prova-lyrion.sh sweetspot-${{ matrix.scheda }}-aggiornamento.tar

# SPDX-License-Identifier: GPL-3.0-or-later
# Compila l'immagine Sweetspot sui server di GitHub. L'immagine si scarica
# dalla pagina dell'esecuzione (sezione "Artifacts") o, per le versioni
# con tag v*, dalla pagina Releases.
name: Compila Sweetspot

on:
  push:
    branches: [main, 'fase*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Un nuovo invio sullo stesso ramo ferma la compilazione precedente.
concurrency:
  group: compila-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nelle pull request che non toccano i file dell'immagine non si ricompila:
  # le prove Lyrion e ALSA usano i pacchetti dell'ultima compilazione di main.
  # Push su main e sui rami fase*, tag e avvii a mano compilano sempre.
  modifiche:
    runs-on: ubuntu-26.04
    outputs:
      compila: ${{ steps.file.outputs.compila }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: File dell'immagine modificati
        id: file
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          compila=true
          if [ "$EVENTO" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" > modificati.txt
            cat modificati.txt
            grep -q -E '^(configs|board|package|patches|scripts)/|^(Config\.in|external\.desc|external\.mk)$' modificati.txt ||
              compila=false
          fi
          echo "compila=$compila" | tee -a "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strumenti di verifica
        run: sudo apt-get update && sudo apt-get install -y busybox-static shellcheck flac jq minisign python3-yaml cpio zstd sqlite3 gcc
      - name: Test degli script
        run: sh tests/run.sh
      - name: Matrice di compatibilità aggiornata
        run: python3 tools/matrice-compatibilita.py --verifica
      - name: Copia di un CD simulato
        run: sh tests/cd-simulato.sh

  build:
    needs: [test, modifiche]
    if: ${{ needs.modifiche.outputs.compila == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PC x86 a 64 bit (chiavetta USB, VMware)
          - scheda: x86_64
            immagine: sweetspot.img
          # Raspberry Pi 4, 400, 5, 500 e Compute Module 4/5 (scheda SD)
          - scheda: rpi
            immagine: sweetspot-rpi.img
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Il kernel del Raspberry Pi con tutti i suoi moduli occupa parecchio:
      # si libera spazio togliendo dal server gli strumenti che non servono.
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1
      - name: Dipendenze di Buildroot
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential cpio file jq libelf-dev libssl-dev minisign rsync unzip wget xz-utils zstd
      # Sorgenti scaricati e ccache: si salvano anche quando la compilazione
      # fallisce, cosi' il tentativo successivo riparte da dove era arrivato.
      - name: Cache di sorgenti e compilazione
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-${{ matrix.scheda }}-${{ github.run_id }}
          restore-keys: |
            buildroot-${{ matrix.scheda }}-
            buildroot-
      # Il registro completo va in build.log (allegato all'esecuzione); qui
      # si vedono solo le fasi (">>> pacchetto versione fase").
      - name: Compila
        run: |
          set -o pipefail
          BR2_DL_DIR=$HOME/.buildroot-dl sh scripts/build.sh sweetspot_${{ matrix.scheda }}_defconfig 2>&1 | tee build.log | grep --line-buffered '^>>>'
      # Le ultime righe utili del registro (senza l'avanzamento degli scaricamenti)
      # diventano annotazioni dell'esecuzione, leggibili anche senza accedere a GitHub.
      - name: Motivo dell'errore
        if: failure()
        run: |
          grep -v -E '^ *[0-9]+K( \.+)+' build.log | tail -n 160 | sed 's/%/%25/g; s/\r//g' > coda.txt
          split -l 20 coda.txt parte.
          for f in parte.*; do
            echo "::error title=Compilazione ($f)::$(awk 'BEGIN{ORS="%0A"} {print}' "$f")"
          done
      - name: Registro della compilazione
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          name: registro-compilazione-${{ matrix.scheda }}
          path: build.log
      - name: Salva la cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-${{ matrix.scheda }}-${{ github.run_id }}
      # Immagine, disco per VMware e pacchetto di aggiornamento si scaricano
      # dalla pagina dell'esecuzione come file, non dentro uno zip.
      - name: Pubblica l'immagine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          path: output/images/${{ matrix.immagine }}.xz
          archive: false
          if-no-files-found: error
      # La stessa immagine come disco per VMware (Workstation, Player, Fusion).
      # Non nelle pull request: per provarle basta l'immagine, e lo spazio degli
      # artifact e' poco.
      - name: Disco per VMware
        if: matrix.scheda == 'x86_64' && github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          qemu-img convert -f raw -O vmdk -o adapter_type=lsilogic,subformat=monolithicSparse \
            output/images/sweetspot.img output/images/sweetspot-vmware.vmdk
      - name: Pubblica il disco per VMware
        if: matrix.scheda == 'x86_64' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          path: output/images/sweetspot-vmware.vmdk
          archive: false
          if-no-files-found: error
      # Pacchetto per aggiornare dalla pagina Sistema (da internet o da un disco).
      # Sui rami e nelle pull request il pacchetto resta non firmato. Sui tag v*
      # passa dal job "firma", l'unico che vede la chiave privata.
      - name: Pubblica il pacchetto di aggiornamento
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          path: output/images/sweetspot-${{ matrix.scheda }}-aggiornamento.tar
          archive: false
          if-no-files-found: error
      - name: Pubblica il pacchetto da firmare
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          name: da-firmare-${{ matrix.scheda }}
          path: output/images/sweetspot-${{ matrix.scheda }}-aggiornamento.tar
          if-no-files-found: error
      # SBOM CycloneDX del sistema compilato (output/target) e vulnerabilita'
      # note con grype (vedi docs/supply-chain.md). Un database irraggiungibile
      # non fa fallire questo passo: decide il controllo del triage che segue.
      - name: SBOM e scansione delle vulnerabilita'
        id: sbom
        continue-on-error: true
        env:
          SYFT: 1.54.1
          GRYPE: 0.120.1
          SCHEDA: ${{ matrix.scheda }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/anchore" sbom
          for s in "syft $SYFT" "grype $GRYPE"; do
            set -- $s
            base=https://github.com/anchore/$1/releases/download/v$2
            wget -q -P "$RUNNER_TEMP/anchore" "$base/${1}_${2}_linux_amd64.tar.gz" "$base/${1}_${2}_checksums.txt"
            (cd "$RUNNER_TEMP/anchore" && grep " ${1}_${2}_linux_amd64.tar.gz\$" "${1}_${2}_checksums.txt" | sha256sum -c -)
            tar -xzf "$RUNNER_TEMP/anchore/${1}_${2}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/anchore" "$1"
          done
          "$RUNNER_TEMP/anchore/syft" dir:output/target -q -o "cyclonedx-json=sbom/sbom-$SCHEDA.cdx.json"
          "$RUNNER_TEMP/anchore/grype" "sbom:sbom/sbom-$SCHEDA.cdx.json" -q \
            -o "json=sbom/grype-$SCHEDA.json" -o "table=sbom/grype-$SCHEDA.txt"
          {
            echo "### SBOM e vulnerabilita' ($SCHEDA, syft $SYFT, grype $GRYPE, $(date -u +%F))"
            echo
            echo "Componenti: $(jq '.components | length' "sbom/sbom-$SCHEDA.cdx.json")"
            echo
            jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' "sbom/grype-$SCHEDA.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pubblica SBOM e scansione
        if: ${{ steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          name: sbom-${{ matrix.scheda }}
          path: sbom
          if-no-files-found: error
      # Ogni CVE Critical o High deve avere una decisione in docs/triage-cve.tsv
      # (non affetta, o accettata con una data di revisione non scaduta):
      # altrimenti la compilazione fallisce e niente si pubblica. Senza
      # scansione un tag v* si ferma; gli altri rami ricevono un avviso.
      - name: Triage delle CVE gravi
        env:
          SCHEDA: ${{ matrix.scheda }}
          SCANSIONE: ${{ steps.sbom.outcome }}
        run: |
          if [ "$SCANSIONE" != success ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) echo "::error::scansione delle vulnerabilita' non riuscita: triage non verificabile"; exit 1 ;;
              *) echo "::warning::scansione delle vulnerabilita' non riuscita: triage non verificato"; exit 0 ;;
            esac
          fi
          rc=0
          python3 scripts/triage-cve.py "sbom/grype-$SCHEDA.json" > triage.txt 2>&1 || rc=$?
          cat triage.txt
          { echo; echo "#### Triage delle CVE ($SCHEDA)"; echo; echo '```'; cat triage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^ERRORE: ' triage.txt | sed 's/^ERRORE: /::error::/' || true
          exit $rc

  # Firma dei soli tag ufficiali. L'ambiente e' esplicito e limitato ai tag v*
  # (vedi docs/aggiornamenti.md): rami e pull request non vedono la chiave.
  firma:
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    environment: firma-aggiornamenti
    strategy:
      fail-fast: false
      matrix:
        scheda: [x86_64, rpi]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strumenti di firma
        run: sudo apt-get update && sudo apt-get install -y minisign cpio zstd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: da-firmare-${{ matrix.scheda }}
          path: output/images
          digest-mismatch: error      # Firma del pacchetto di aggiornamento con la chiave del progetto (segreto
      # SWEETSPOT_FIRMA, vedi scripts/genera-chiave-firma.sh). Sui tag ufficiali
      # firma e chiave incorporata sono obbligatorie. Senza il segreto, solo
      # le compilazioni di sviluppo possono produrre pacchetti non firmati.
      - name: Firma del pacchetto di aggiornamento
        env:
          FIRMA: ${{ secrets.SWEETSPOT_FIRMA }}
        run: |
          set -euo pipefail
          T=output/images/sweetspot-${{ matrix.scheda }}-aggiornamento.tar
          P=board/sweetspot/rootfs-overlay/etc/sweetspot/aggiornamenti.pub
          if [ -z "$FIRMA" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error title=Release non firmata::manca il segreto SWEETSPOT_FIRMA"
                exit 1
                ;;
            esac
            echo "::warning title=Aggiornamento non firmato::manca il segreto SWEETSPOT_FIRMA (scripts/genera-chiave-firma.sh)"
            exit 0
          fi
          [ -s "$P" ] || { echo "::error::manca la chiave pubblica degli aggiornamenti"; exit 1; }
          d=$(mktemp -d); chmod 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$FIRMA" > "$d/chiave"
          mkdir "$d/pacchetto"
          tar -xf "$T" -C "$d/pacchetto"
          [ "$(cat "$d/pacchetto/architettura")" = '${{ matrix.scheda }}' ]
          # Ricalcola tutti i file: il manifesto deve descrivere esattamente
          # il contenuto che sara' installato, compresi versione e architettura.
          (cd "$d/pacchetto" && find . -type f ! -path ./SHA256SUMS ! -path ./SHA256SUMS.minisig |
            sed 's|^\./||' | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > "$d/SHA256SUMS.attesi"
          cmp "$d/pacchetto/SHA256SUMS" "$d/SHA256SUMS.attesi"
          zstd -dc "$d/pacchetto/rootfs.cpio.zst" |
            cpio --quiet -i --to-stdout 'etc/sweetspot/aggiornamenti.pub' './etc/sweetspot/aggiornamenti.pub' > "$d/incorporata.pub"
          cmp "$P" "$d/incorporata.pub"
          minisign -S -s "$d/chiave" -m "$d/pacchetto/SHA256SUMS" -x "$d/pacchetto/SHA256SUMS.minisig" \
            -t "Sweetspot $(cat "$d/pacchetto/versione") $(cat "$d/pacchetto/architettura")"
          minisign -V -p "$P" -m "$d/pacchetto/SHA256SUMS" -x "$d/pacchetto/SHA256SUMS.minisig"
          tar -rf "$T" -C "$d/pacchetto" SHA256SUMS.minisig
      - name: Pubblica il pacchetto firmato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          path: output/images/sweetspot-${{ matrix.scheda }}-aggiornamento.tar
          archive: false
          if-no-files-found: error
  # Lyrion nel sistema appena compilato, su un server della stessa
  # architettura: per il Raspberry Pi e' la prova che i moduli compilati per
  # ARM funzionano con il Perl del sistema.
  lyrion:
    needs: [build, modifiche]
    # Anche se una delle due compilazioni non e' riuscita, l'altra si prova;
    # senza compilazione si provano i pacchetti di main. Se la compilazione
    # era dovuta ma e' saltata (test falliti) non c'e' nulla da provare: il job
    # si salta invece di fallire a catena sugli artifact che mancano.
    if: >-
      ${{ !cancelled() && needs.modifiche.result == 'success' &&
      (needs.modifiche.outputs.compila != 'true' ||
      needs.build.result == 'success' || needs.build.result == 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheda: x86_64
            runner: ubuntu-26.04
          - scheda: rpi
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pacchetti di questa esecuzione o, se non si e' compilato, dell'ultima
      # compilazione riuscita di main che li ha ancora; l'evidenza lo registra.
      - name: Pacchetti da provare
        id: pacchetti
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILA: ${{ needs.modifiche.outputs.compila }}
          SCHEDA: ${{ matrix.scheda }}
        run: |
          mkdir -p "$RUNNER_TEMP/sweetspot-audio-evidence"
          id=$GITHUB_RUN_ID
          if [ "$COMPILA" = true ]; then
            # Una sola compilazione riuscita: l'altra scheda non ha pacchetti.
            nome=$([ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ] && echo "da-firmare-$SCHEDA" || echo "sweetspot-$SCHEDA-aggiornamento.tar")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[].name' | grep -qx "$nome" || {
              echo "compilazione di $SCHEDA non riuscita in questa esecuzione: niente da provare" > "$RUNNER_TEMP/sweetspot-audio-evidence/pacchetti.txt"
              echo "::error::la compilazione di $SCHEDA non ha prodotto $nome (vedi il job build): prova Lyrion non eseguita"
              exit 1
            }
          else
            # La compilazione di main piu' recente con tutti i file da provare,
            # qualunque sia l'esito dell'esecuzione: se dopo la build un altro
            # job fallisce o l'esecuzione viene annullata, i pacchetti valgono
            # lo stesso. Filtrare per esito faceva provare immagini vecchie
            # (prima del demone a eventi) con le prove di oggi.
            servono="sweetspot-$SCHEDA-aggiornamento.tar"
            [ "$SCHEDA" != x86_64 ] || servono="$servono sweetspot.img.xz"
            id=""
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&event=push&per_page=30" --jq '.workflow_runs[].id'); do
              nomi=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired | not) | .name') || continue
              manca=""
              for n in $servono; do printf '%s\n' "$nomi" | grep -qx "$n" || manca=1; done
              [ -n "$manca" ] || { id=$r; break; }
            done
            [ -n "$id" ] || { echo "::error::nessuna compilazione di main con $servono"; exit 1; }
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha' 2>/dev/null || echo "?")
          printf 'compilazione: %s/%s/actions/runs/%s\ncommit: %s\nricompilato in questa esecuzione: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$id" "$sha" "$COMPILA" | tee "$RUNNER_TEMP/sweetspot-audio-evidence/pacchetti.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('da-firmare-{0}', matrix.scheda) || format('sweetspot-{0}-aggiornamento.tar', matrix.scheda) }}
          run-id: ${{ steps.pacchetti.outputs.id }}
          github-token: ${{ github.token }}
      - name: Strumenti
        run: sudo apt-get update && sudo apt-get install -y zstd cpio curl python3
      - name: Lyrion e verifica PCM nel sistema compilato
        env:
          SWEETSPOT_AUDIO_REPORT_DIR: ${{ runner.temp }}/sweetspot-audio-evidence
        run: sudo -E env SWEETSPOT_AUDIO_REPORT_DIR="${{ runner.temp }}/sweetspot-audio-evidence" sh tests/prova-lyrion.sh sweetspot-${{ matrix.scheda }}-aggiornamento.tar
      # Percorso ALSA vero (hw:Loopback di snd-aloop) nel kernel PREEMPT_RT di
      # Sweetspot: il kernel del runner non ha snd-aloop, quindi l'immagine x86
      # si avvia in QEMU. Il kernel del Raspberry Pi non si avvia in QEMU.
      # Le prove in QEMU girano anche se quella di Lyrion fallisce, ma non
      # senza pacchetti o senza immagine (altrimenti fallirebbero a catena).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: immagine
        if: ${{ !cancelled() && steps.pacchetti.outcome == 'success' && matrix.scheda == 'x86_64' }}
        with:
          name: sweetspot.img.xz
          run-id: ${{ steps.pacchetti.outputs.id }}
          github-token: ${{ github.token }}
      - name: Verifica PCM/DoP sul percorso ALSA in QEMU
        if: ${{ !cancelled() && steps.immagine.outcome == 'success' && matrix.scheda == 'x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools xz-utils sshpass
          versione=$(tar -xOf sweetspot-x86_64-aggiornamento.tar versione)
          sudo env SWEETSPOT_AUDIO_REPORT_DIR="${{ runner.temp }}/sweetspot-audio-evidence" sh tests/prova-alsa-qemu.sh sweetspot.img.xz "$versione"
      # DAC scollegato e ricollegato a caldo, watchdog, riavvio brusco.
      - name: Prove di robustezza in QEMU
        if: ${{ !cancelled() && steps.immagine.outcome == 'success' && matrix.scheda == 'x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools xz-utils sshpass dosfstools
          sudo env SWEETSPOT_AUDIO_REPORT_DIR="${{ runner.temp }}/sweetspot-audio-evidence" sh tests/prova-robustezza-qemu.sh sweetspot.img.xz
      - name: Evidenza della verifica audio software
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          name: verifica-audio-${{ matrix.scheda }}
          path: ${{ runner.temp }}/sweetspot-audio-evidence
          if-no-files-found: error

  # Una sola pubblicazione, dopo il successo di entrambe le compilazioni e
  # di entrambi i test Lyrion. Un gate fallito, saltato o annullato la blocca.
  release:
    needs: [test, build, firma, lyrion]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          needs.firma.result == 'success' &&
          needs.lyrion.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # archive:false usa il nome del file come nome dell'artifact. v8 lo
      # scarica direttamente, senza estrarre il tar del pacchetto.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweetspot.img.xz
          path: artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweetspot-rpi.img.xz
          path: artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweetspot-vmware.vmdk
          path: artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweetspot-x86_64-aggiornamento.tar
          path: artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweetspot-rpi-aggiornamento.tar
          path: artifacts
          digest-mismatch: error
      - name: Strumenti di verifica
        run: sudo apt-get update && sudo apt-get install -y minisign cpio zstd
      - name: Verifica degli aggiornamenti firmati
        run: |
          set -euo pipefail
          P=board/sweetspot/rootfs-overlay/etc/sweetspot/aggiornamenti.pub
          [ -s "$P" ] || { echo "::error::manca la chiave pubblica degli aggiornamenti"; exit 1; }
          for image in sweetspot.img.xz sweetspot-rpi.img.xz sweetspot-vmware.vmdk; do
            [ -s "artifacts/$image" ]
          done
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          for board in x86_64 rpi; do
            mkdir "$d/$board"
            tar -xf "artifacts/sweetspot-$board-aggiornamento.tar" -C "$d/$board"
            tc=$(minisign -V -Q -p "$P" -m "$d/$board/SHA256SUMS" -x "$d/$board/SHA256SUMS.minisig")
            [ "$(cat "$d/$board/architettura")" = "$board" ]
            [ "$tc" = "Sweetspot $(cat "$d/$board/versione") $board" ]
            (cd "$d/$board" && find . -type f ! -path ./SHA256SUMS ! -path ./SHA256SUMS.minisig |
              sed 's|^\./||' | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > "$d/SHA256SUMS.attesi"
            cmp "$d/$board/SHA256SUMS" "$d/SHA256SUMS.attesi"
            zstd -dc "$d/$board/rootfs.cpio.zst" |
              cpio --quiet -i --to-stdout 'etc/sweetspot/aggiornamenti.pub' './etc/sweetspot/aggiornamenti.pub' > "$d/incorporata.pub"
            cmp "$P" "$d/incorporata.pub"
          done
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/sweetspot.img.xz
            artifacts/sweetspot-rpi.img.xz
            artifacts/sweetspot-vmware.vmdk
            artifacts/sweetspot-x86_64-aggiornamento.tar
            artifacts/sweetspot-rpi-aggiornamento.tar
          fail_on_unmatched_files: true

  # Unico controllo richiesto dalla protezione di main (scripts/proteggi-main.sh):
  # i job a matrice o saltati hanno nomi variabili, questo no. Passa solo se
  # nessun job necessario e' fallito o annullato; "saltato" e' ammesso perche'
  # le pull request che non toccano l'immagine non compilano.
  esito:
    needs: [modifiche, test, build, lyrion]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Esito dei job
        env:
          RISULTATI: ${{ toJSON(needs) }}
        run: |
          echo "$RISULTATI" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$RISULTATI" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null

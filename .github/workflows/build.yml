# SPDX-License-Identifier: GPL-3.0-or-later
# Compila l'immagine Sweetspot sui server di GitHub. L'immagine si scarica
# dalla pagina dell'esecuzione (sezione "Artifacts") o, per le versioni
# con tag v*, dalla pagina Releases.
name: Compila Sweetspot

on:
  push:
    branches: [main, 'fase*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Un nuovo invio sullo stesso ramo ferma la compilazione precedente.
concurrency:
  group: compila-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Strumenti di verifica
        run: sudo apt-get update && sudo apt-get install -y busybox-static shellcheck flac jq
      - name: Test degli script
        run: sh tests/run.sh
      - name: Copia di un CD simulato
        run: sh tests/cd-simulato.sh

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dipendenze di Buildroot
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential cpio file libelf-dev libssl-dev rsync unzip wget xz-utils
      # Sorgenti scaricati e ccache: si salvano anche quando la compilazione
      # fallisce, cosi' il tentativo successivo riparte da dove era arrivato.
      - name: Cache di sorgenti e compilazione
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-${{ github.run_id }}
          restore-keys: buildroot-
      # Il registro completo va in build.log (allegato all'esecuzione); qui
      # si vedono solo le fasi (">>> pacchetto versione fase").
      - name: Compila
        run: |
          set -o pipefail
          BR2_DL_DIR=$HOME/.buildroot-dl sh scripts/build.sh 2>&1 | tee build.log | grep --line-buffered '^>>>'
      # Le ultime righe utili del registro (senza l'avanzamento degli scaricamenti)
      # diventano annotazioni dell'esecuzione, leggibili anche senza accedere a GitHub.
      - name: Motivo dell'errore
        if: failure()
        run: |
          grep -v -E '^ *[0-9]+K( \.+)+' build.log | tail -n 160 | sed 's/%/%25/g; s/\r//g' > coda.txt
          split -l 20 coda.txt parte.
          for f in parte.*; do
            echo "::error title=Compilazione ($f)::$(awk 'BEGIN{ORS="%0A"} {print}' "$f")"
          done
      - name: Registro della compilazione
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilazione
          path: build.log
      - name: Salva la cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-${{ github.run_id }}
      - name: Pubblica l'immagine
        uses: actions/upload-artifact@v4
        with:
          name: sweetspot-x86_64
          path: output/images/sweetspot.img.xz
          compression-level: 0
      # La stessa immagine come disco per VMware (Workstation, Player, Fusion).
      - name: Disco per VMware
        run: |
          sudo apt-get install -y qemu-utils
          qemu-img convert -f raw -O vmdk -o adapter_type=lsilogic,subformat=monolithicSparse \
            output/images/sweetspot.img output/images/sweetspot-vmware.vmdk
      - name: Pubblica il disco per VMware
        uses: actions/upload-artifact@v4
        with:
          name: sweetspot-vmware
          path: output/images/sweetspot-vmware.vmdk
      # Pacchetto per aggiornare dalla pagina Sistema (da internet o da un disco).
      - name: Pubblica il pacchetto di aggiornamento
        uses: actions/upload-artifact@v4
        with:
          name: sweetspot-x86_64-aggiornamento
          path: output/images/sweetspot-x86_64-aggiornamento.tar
          compression-level: 0
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/images/sweetspot.img.xz
            output/images/sweetspot-x86_64-aggiornamento.tar
            output/images/sweetspot-vmware.vmdk

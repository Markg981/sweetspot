# SPDX-License-Identifier: GPL-3.0-or-later
# Compila l'immagine Sweetspot sui server di GitHub. L'immagine si scarica
# dalla pagina dell'esecuzione (sezione "Artifacts") o, per le versioni
# con tag v*, dalla pagina Releases.
name: Compila Sweetspot

on:
  push:
    branches: [main, 'fase*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Strumenti di verifica
        run: sudo apt-get update && sudo apt-get install -y busybox-static shellcheck flac jq
      - name: Test degli script
        run: sh tests/run.sh
      - name: Copia di un CD simulato
        run: sh tests/cd-simulato.sh

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dipendenze di Buildroot
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential cpio file libelf-dev libssl-dev rsync unzip wget xz-utils
      - name: Cache di sorgenti e compilazione
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: buildroot-${{ hashFiles('configs/**', 'board/sweetspot/common/**') }}
          restore-keys: buildroot-
      - name: Compila
        run: |
          set -o pipefail
          BR2_DL_DIR=$HOME/.buildroot-dl sh scripts/build.sh 2>&1 | tee build.log
      # Le ultime righe del registro diventano annotazioni dell'esecuzione,
      # leggibili anche senza accedere a GitHub.
      - name: Motivo dell'errore
        if: failure()
        run: |
          tail -n 160 build.log | sed 's/%/%25/g; s/\r//g' > coda.txt
          split -l 20 coda.txt parte.
          for f in parte.*; do
            echo "::error title=Compilazione ($f)::$(awk 'BEGIN{ORS="%0A"} {print}' "$f")"
          done
      - name: Pubblica l'immagine
        uses: actions/upload-artifact@v4
        with:
          name: sweetspot-x86_64
          path: output/images/sweetspot.img.xz
          compression-level: 0
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/images/sweetspot.img.xz

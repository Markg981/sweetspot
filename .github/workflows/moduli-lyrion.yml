# SPDX-License-Identifier: GPL-3.0-or-later
# Moduli compilati di Lyrion (XS) per Perl 5.42 sulle architetture per cui
# Lyrion non li fornisce (oggi solo x86_64). Si compilano con lo script
# ufficiale di Lyrion (LMS-Community/slimserver-vendor, CPAN/buildme.sh) in
# Fedora 43, che ha Perl 5.42 e glibc 2.42 come la toolchain di Buildroot,
# su un server ARM di GitHub. Il risultato si pubblica nella release
# "dipendenze-lyrion" e lo usa il pacchetto Buildroot lms-moduli.
name: Moduli di Lyrion

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/moduli-lyrion.yml', 'tools/moduli-lyrion/**']
  push:
    branches: [main]
    paths: ['.github/workflows/moduli-lyrion.yml', 'tools/moduli-lyrion/**']

permissions:
  contents: write

env:
  # LMS-Community/slimserver-vendor, ramo public/9.1 (Lyrion 9.1)
  VENDOR_REF: b62107b46a3cb9c452139cbe34d5fabbda61fb09
  FEDORA: '43'

jobs:
  moduli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - piattaforma: arm64
            runner: ubuntu-26.04-arm
            arch: aarch64-linux-thread-multi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LMS-Community/slimserver-vendor
          ref: ${{ env.VENDOR_REF }}
          path: vendor
      # Su ARM update-config.sh scarica config.guess e config.sub da
      # git.savannah.gnu.org a ogni libreria (libjpeg, ...): quando savannah
      # risponde 502 la compilazione si ferma ("cannot guess build type").
      # Era la causa degli errori "passeggeri". Si usano quelli di automake
      # di Fedora, aggiornati e sempre disponibili.
      - name: Immagine Fedora con gli strumenti di compilazione
        run: |
          cd vendor/CPAN
          sed -i "s/^FROM fedora:.*/FROM fedora:${FEDORA}/" Docker/Dockerfile.fedora
          printf '\nRUN dnf install -y automake && dnf clean all\n' >> Docker/Dockerfile.fedora
          cat > update-config.sh <<'FINE'
          #!/bin/sh
          # Sweetspot: config.guess e config.sub di automake (Fedora), non da savannah.
          if [ "`uname -m`" = "aarch64" -a "`uname`" = "Linux" ]; then
              d=$(ls -d /usr/share/automake-* | sort -V | tail -n 1)
              cp -vf "$d/config.guess" ./config.guess
              cp -vf "$d/config.sub" ./config.sub
          fi
          FINE
          docker build --rm -f Docker/Dockerfile.fedora -t moduli .
          docker run --rm moduli sh -c 'for f in /usr/share/automake-*/config.guess; do echo "$f: $($f)"; done'
          docker run --rm moduli perl -e 'print "Perl $^V, $^O, $Config::Config{archname}\n"; use Config'
      # Se buildme.sh si ferma comunque per un errore passeggero, si riprova
      # una volta da capo. Se non
      # riesce, le ultime righe del registro diventano annotazioni
      # dell'esecuzione, leggibili senza scaricare nulla; il registro
      # completo resta negli allegati.
      - name: Compila i moduli
        run: |
          cd vendor/CPAN
          coda() { # registro livello titolo
            grep -v -E '^[[:space:]]*$' "$1" | tail -n 100 | sed 's/%/%25/g; s/\r//g' > coda.txt
            split -l 20 coda.txt parte.
            for f in parte.*; do
              echo "::$2 title=$3 ($f)::$(awk 'BEGIN{ORS="%0A"} {print}' "$f")"
            done
            rm -f coda.txt parte.*
          }
          for t in 1 2; do
            rc=0
            docker run --rm -v "$PWD":/cpan moduli ./buildme.sh -t > build-$t.log 2>&1 || rc=$?
            cp build-$t.log build.log
            grep -E '^(Building|ERROR|Error)|cannot|failed' build-$t.log || true
            # L'esito lo dice la cartella dei moduli (il codice di uscita di
            # buildme.sh si riporta solo nei messaggi).
            if [ -d build/arch/5.42/${{ matrix.arch }}/auto ]; then
              ls build/arch/5.42/${{ matrix.arch }}/auto
              exit 0
            fi
            if [ $t = 1 ]; then
              coda build-1.log warning "Primo tentativo non riuscito (codice $rc), si riprova"
              sudo rm -rf build
            else
              coda build-2.log error "Compilazione dei moduli non riuscita (codice $rc)"
            fi
          done
          exit 1
      - name: Prova di caricamento
        run: |
          docker run --rm -v "$PWD":/w -w /w moduli \
            perl -I vendor/CPAN/build/arch/5.42/${{ matrix.arch }} -I vendor/CPAN/build/arch/5.42 \
            tools/moduli-lyrion/prova.pl
      # Il nome porta la versione di slimserver-vendor e di Fedora: un file
      # pubblicato non cambia mai, così Buildroot può fissarne lo SHA-256.
      - name: Pacchetto
        id: pacchetto
        run: |
          N=lyrion-cpan-5.42-${{ matrix.arch }}-${VENDOR_REF:0:7}-fc${FEDORA}
          tar -C vendor/CPAN/build/arch --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime=@0 -cJf $N.tar.xz 5.42
          sha256sum $N.tar.xz | tee $N.tar.xz.sha256
          echo "nome=$N" >> "$GITHUB_OUTPUT"
      - name: Registro della compilazione
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registro-moduli-${{ matrix.piattaforma }}
          path: vendor/CPAN/build*.log
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pacchetto.outputs.nome }}
          path: ${{ steps.pacchetto.outputs.nome }}.tar.xz*
          compression-level: 0
      # Si aggiunge solo un file che non c'è ancora: quelli già pubblicati
      # restano identici (lo SHA-256 nel pacchetto Buildroot resta valido).
      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.pacchetto.outputs.nome }}
        run: |
          T=dipendenze-lyrion
          if ! gh release view $T >/dev/null 2>&1; then
            gh release create $T --prerelease --title "Dipendenze di Lyrion (moduli compilati)" --notes \
              "Moduli XS di Lyrion Music Server per Perl 5.42 sulle architetture che Lyrion non fornisce, compilati con lo script ufficiale CPAN/buildme.sh di LMS-Community/slimserver-vendor (il nome di ogni file dice la versione di slimserver-vendor e di Fedora). Li usa il pacchetto Buildroot lms-moduli: non sono un'immagine da scrivere."
          fi
          if gh release view $T --json assets --jq '.assets[].name' | grep -qx "$N.tar.xz"; then
            echo "$N.tar.xz è già pubblicato: resta quello."
          else
            gh release upload $T $N.tar.xz $N.tar.xz.sha256
          fi

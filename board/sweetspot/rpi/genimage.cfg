# Sweetspot - immagine per Raspberry Pi 4 e 5 (scheda SD o chiavetta USB).
# Un'unica partizione FAT32 chiamata SWEETSPOT, leggibile da Windows e
# macOS: firmware di avvio, le due copie del sistema (cartelle a e b, la b
# si crea con il primo aggiornamento) e le impostazioni (sweetspot.txt).

image sweetspot-rpi.vfat {
	vfat {
		extraargs = "-F 32 -n SWEETSPOT"
		file "config.txt" { image = "chiavetta/config.txt" }
		file "start4.elf" { image = "chiavetta/start4.elf" }
		file "fixup4.dat" { image = "chiavetta/fixup4.dat" }
		file "sweetspot-avvio.env" { image = "chiavetta/sweetspot-avvio.env" }
		file "sweetspot-scheda.txt" { image = "chiavetta/sweetspot-scheda.txt" }
		file "a" { image = "chiavetta/a" }
		file "boot" { image = "chiavetta/boot" }
		file "sweetspot.txt" { image = "chiavetta/sweetspot.txt" }
		file "LEGGIMI.txt" { image = "chiavetta/LEGGIMI.txt" }
	}
	size = 1024M
}

image sweetspot-rpi.img {
	hdimage {
	}

	partition sweetspot {
		partition-type = 0xC
		bootable = true
		offset = 4M
		image = "sweetspot-rpi.vfat"
	}
}

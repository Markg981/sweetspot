# Sweetspot - immagine per chiavetta USB, avviabile sia da BIOS sia da UEFI
# (64 e 32 bit). Un'unica partizione FAT32 chiamata SWEETSPOT, leggibile
# da Windows e macOS, contiene sistema, menu di avvio e impostazioni.

image sweetspot.vfat {
	vfat {
		extraargs = "-F 32 -n SWEETSPOT"
		file "bzImage" { image = "chiavetta/bzImage" }
		file "rootfs.cpio.zst" { image = "chiavetta/rootfs.cpio.zst" }
		file "EFI" { image = "chiavetta/EFI" }
		file "boot" { image = "chiavetta/boot" }
		file "sweetspot.txt" { image = "chiavetta/sweetspot.txt" }
		file "LEGGIMI.txt" { image = "chiavetta/LEGGIMI.txt" }
	}
	size = 512M
}

image sweetspot.img {
	hdimage {
	}

	# Primo stadio di GRUB per i PC con BIOS (MBR, senza la tabella).
	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	# Secondo stadio di GRUB, nello spazio libero prima della partizione.
	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition sweetspot {
		partition-type = 0xC
		bootable = true
		offset = 1M
		image = "sweetspot.vfat"
	}
}

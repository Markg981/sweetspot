# Sweetspot - menu di avvio. Non va modificato: le impostazioni sono in
# sweetspot.txt, nella cartella principale della chiavetta.

set timeout=3
set default=0

# Parametri sempre attivi: USB sempre alimentato, niente audit del kernel,
# riavvio automatico dopo 10 secondi se il sistema non riesce a partire.
set sweetspot_base="quiet loglevel=3 usbcore.autosuspend=-1 audit=0 panic=10"

# Parametri adattati a questo computer (core dedicati, stati della CPU):
# li scrive Sweetspot al primo avvio.
set sweetspot_tune=""
if [ -f ($root)/boot/grub/auto.cfg ]; then
	source ($root)/boot/grub/auto.cfg
fi

# Due copie del sistema: A nella cartella principale, B nella cartella b.
# "slot" e' la copia in uso; "prova" una copia appena aggiornata, da
# avviare una volta sola: se non arriva a confermarsi (sweetspot-aggiorna
# conferma), all'avvio successivo riparte "slot".
set slot=a
set prova=""
if [ -f ($root)/boot/grub/grubenv ]; then
	load_env -f ($root)/boot/grub/grubenv slot prova
fi
set avvio=$slot
if [ -n "$prova" ]; then
	set avvio=$prova
	set tentato=$prova
	set prova=""
	save_env -f ($root)/boot/grub/grubenv prova tentato
fi
if [ "$avvio" = b ]; then
	set sistema=/b
	set altro=a
	set sistema_altro=""
else
	set avvio=a
	set sistema=""
	set altro=b
	set sistema_altro=/b
fi
probe --fs-uuid --set=sweetspot_uuid $root
export root sweetspot_base sweetspot_tune sistema avvio altro sistema_altro sweetspot_uuid

menuentry "Sweetspot" {
	linux $sistema/bzImage $sweetspot_base $sweetspot_tune sweetspot.slot=$avvio sweetspot.part=$sweetspot_uuid
	initrd $sistema/rootfs.cpio.zst
}

menuentry "Sweetspot - avvio sicuro (senza ottimizzazioni)" {
	linux $sistema/bzImage $sweetspot_base sweetspot.sicuro=1 sweetspot.slot=$avvio sweetspot.part=$sweetspot_uuid
	initrd $sistema/rootfs.cpio.zst
}

if [ -f ($root)$sistema_altro/bzImage -a -f ($root)$sistema_altro/rootfs.cpio.zst ]; then
	menuentry "Sweetspot - l'altra versione installata" {
		linux $sistema_altro/bzImage $sweetspot_base $sweetspot_tune sweetspot.slot=$altro sweetspot.part=$sweetspot_uuid
		initrd $sistema_altro/rootfs.cpio.zst
	}
fi

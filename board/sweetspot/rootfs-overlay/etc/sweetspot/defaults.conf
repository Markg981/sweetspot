# Sweetspot - valori predefiniti. Le impostazioni dell'utente stanno in
# sweetspot.txt sulla chiavetta e hanno la precedenza.
NOME_PLAYER=Sweetspot
MODALITA=completa
MODALITA_ASCOLTO=si
PRECARICO=si
PRECARICO_MB=auto
PRECARICO_FILE_MAX_MB=1024
PRECARICO_STANDBY=si
# Renderer UPnP/DLNA in entrata (BubbleUPnP, JPlay, mconnect): spento di serie.
RENDERER_UPNP=no
# Media server UPnP/DLNA della libreria (MiniDLNA): spento di serie.
SERVER_UPNP=no
# Interfacce del media server (es. eth0,wlan0); vuoto: tutte.
DLNA_INTERFACCE=
# Tetti di memoria (MB o auto) per Lyrion, per il suo scanner e per la cache
# delle copertine in RAM (cgroup v2 e tmpfs con size=)
LYRION_MEM_MB=auto
SCANNER_MEM_MB=auto
ARTWORK_RAM_MB=auto
# Dove tenere la cache delle copertine di Lyrion: auto (archivio se c'e', se no RAM),
# ram, archivio, disco (con CACHE_COPERTINE_DISCO = nome del disco in /media).
# CACHE_COPERTINE_MB: tetto sul disco in MB (auto = 1024).
CACHE_COPERTINE=auto
CACHE_COPERTINE_DISCO=
CACHE_COPERTINE_MB=auto
# Eta' massima (minuti) dei dati non salvati sulla chiavetta durante l'ascolto:
# oltre si salva comunque, a bassa priorita' (0 = solo a sistema fermo).
DATI_ETA_MAX_MIN=30
# Copia dei CD: servizi online (HTTPS) interrogati. CD_CERCA_TITOLI = titoli e
# copertina da MusicBrainz e Cover Art Archive; CD_ACCURATERIP = verifica con
# AccurateRip. Con no il servizio non viene contattato (titoli generici).
CD_CERCA_TITOLI=si
CD_ACCURATERIP=si
DISCHI=si
ESCLUDI_DISCHI=
SERVER=
DAC=auto
PROFILO=bilanciato
ENERGIA=fisso
DSD=auto
# Margine (dB) della conversione DSD -> PCM: da -24 a 0, predefinito -3.
# I DSD "over" superano 0 dBFS fino a +3 dB; senza margine verrebbero tagliati.
DSD_PCM_MARGINE_DB=-3
VOLUME=fisso
# Volume (0-100) a cui si riporta Lyrion passando a caldo dal volume fisso
# (100) al volume software o dsp, se lo supera: evita il picco al cambio.
VOLUME_SICURO=25
RICAMPIONAMENTO=no
FILTRO=lineare
CORREZIONE=no
# Se la correzione richiesta non si puo' preparare: blocca (non suona senza
# correzione, predefinito) o diretto (suona sul DAC con avviso visibile).
CORREZIONE_SE_ASSENTE=blocca
# Con i FIR (un impulso per frequenza: fir-44100.wav, fir-48000.wav...) le
# frequenze senza FIR seguono la politica qui sopra (blocca: quei brani non
# suonano; diretto: suonano senza FIR, con avviso). si = invece le ricampiona
# alla frequenza del FIR piu' vicino.
FIR_RICAMPIONA=no
FREQUENZA_MAX=0
# ricampiona = ricampiona solo le frequenze che il DAC rifiuta (le altre restano
# bit-perfect); blocca = rifiuto stretto, il brano non suona e lo Stato lo segnala
FREQUENZA_NON_SUPPORTATA=ricampiona
# Diario di bordo sulla chiavetta (sweetspot-diario): ogni quante ore salva
# il registro (1-24), dimensione massima in KB di ogni file prima della rotazione.
DIARIO=si
DIARIO_ORE=2
DIARIO_KB=256
LIVENESS=si
LIVENESS_LYRION_TIMEOUT=8
LIVENESS_LYRION_FALLIMENTI=3
LIVENESS_PLAYER_SECONDI=20
LIVENESS_BACKOFF_MIN=60
LIVENESS_BACKOFF_MAX=900
LIVENESS_FUNZ_PERIODO=120
LIVENESS_FUNZ_FALLIMENTI=3
LIVENESS_FUNZ_ATTESA=5
LIVENESS_RIAVVII_MAX=3
LIVENESS_RIAVVII_FINESTRA=1800
PAUSA_DSD_MS=500
PAUSA_FREQUENZA_MS=0
NOME_RETE=sweetspot
WIFI_NOME=
WIFI_PASSWORD=
HOTSPOT=si
HOTSPOT_ATTESA=60
HOTSPOT_PROVA=40
HOTSPOT_PASSWORD=
RISPARMIO_RETE=no
USCITA_INTEGRATA=no
SCHEDA_I2S=
SCHERMO_MINUTI=2
PERIFERICHE_INUTILIZZATE=spente
ALTRI_DAC=no
SSH=no
SSH_PASSWORD=
SSH_UTENTE=assistenza
HTTPS=no
HTTPS_REINDIRIZZA=no
PASSWORD_WEB=
LYRION_UTENTE=
LYRION_PASSWORD=
OTTIMIZZAZIONI=si
WATCHDOG=si
# Buffer ALSA in millisecondi (massimo 499) e numero di periodi. Valori
# conservativi per la musica senza schermo: un buffer ampio da' margine
# all'alimentazione; non cambia il clock di conversione del DAC.
BUFFER_ALSA_MS=400
PERIODI_ALSA=4
# Priorita' real-time del thread di riproduzione e delle interruzioni USB:
# stabilita' temporale dell'alimentazione dei buffer, non jitter del DAC.
PRIORITA_AUDIO=80
PRIORITA_IRQ_USB=90
# Priorita' real-time di CamillaDSP (correzione ambientale): sotto il player.
# E' quella del thread di riproduzione; elaborazione e cattura hanno 1 e 2 in meno.
PRIORITA_DSP=70
FIR_MARGINE_DB=3
# Latenza real-time misurata durante l'ascolto (si/no): 100 risvegli al
# secondo sul core della riproduzione, risultato nella pagina Stato.
LATENZA_ASCOLTO=no
# Dimensione (KB) oltre la quale si ruota il registro di Squeezelite; gli XRUN
# gia' contati restano nei contatori della pagina Stato.
LOG_SQUEEZELITE_KB=1024
# Quota dei log in RAM (/var/log, /run, /tmp, anche Lyrion e le zone): tetto di
# ogni file e dimensione complessiva in KB; oltre si tronca il meno recente.
LOG_FILE_KB=512
LOG_QUOTA_KB=4096
LOG_QUOTA_SECONDI=120
# Bluetooth come sorgente (telefono -> DAC): spento di serie. Il nome e' quello
# che il telefono vede (vuoto = NOME_PLAYER).
BLUETOOTH=no
BLUETOOTH_NOME=
# BLUETOOTH_VOLUME_MAX: tetto del volume del telefono (0-100, % della scala
# A2DP). Il percorso Bluetooth non passa da CamillaDSP ne' dal limitatore:
# senza tetto il livello lo decide il telefono. Il default 25 e' coerente con
# VOLUME_SICURO; sotto il tetto il telefono regola liberamente. Il tetto si
# applica a ogni evento di bluealsa e in ogni caso ogni 0,2 s: il telefono puo'
# superarlo al massimo per quella finestra.
BLUETOOTH_VOLUME_MAX=25
